<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>拡大すると文字が切れるページ</title>
</head>
<body>
<main>
  <h1>拡大すると文字が切れるページ</h1>
  <div id="fixed" style="overflow: hidden; height: 1.5em; font-size: 16px;">高さを 1 行ぶんに固定して、あふれた部分を隠している箱です。文章が長いので、折り返した 2 行目から先は見えなくなります。拡大すると、見えない部分がさらに増えます。もう少し文章を続けて、幅の広い画面でも確実に折り返すようにしておきます。ここまで読めていれば、切れていません。</div>
  <p id="free">高さを固定していない段落です。内容に合わせて伸びるので、拡大しても切れません。</p>
</main>
</body>
</html>
