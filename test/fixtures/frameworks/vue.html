<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vue のサンプル</title>
<style>
  body { margin: 2rem; font-family: sans-serif; line-height: 1.7; }
  .box { display: inline-block; padding: 0.75rem 1rem; margin: 0 1rem 1rem 0; border: 1px solid #555; }
  .tip-wrap { position: relative; display: inline-block; }
  .tip { position: absolute; top: 3.5rem; left: 0; padding: 0.5rem; background: #222; color: #fff; white-space: nowrap; }
  button, select, input { font: inherit; min-height: 2.75rem; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="dist/vue.js"></script>
</body>
</html>
