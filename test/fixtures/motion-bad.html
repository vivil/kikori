<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>宣言のない動き</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  #ticker { width: 320px; height: 48px; line-height: 48px; padding: 0 12px; background: #1a4d8f; color: #fff; }
  #still { margin-top: 24px; }
  #spinner { width: 40px; height: 40px; margin-top: 24px; border: 4px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<h1>宣言のない動き</h1>
<p id="ticker">お知らせ 0</p>
<p id="still">この文章は動きません。</p>
<div id="spinner" role="img" aria-label="読み込み中"></div>
<script>
  // CSS のアニメーションを使わずに、スクリプトで表示を書き換え続ける。
  let n = 0;
  setInterval(() => {
    n++;
    const ticker = document.getElementById("ticker");
    ticker.textContent = "お知らせ " + n;
    ticker.style.background = n % 2 ? "#8f1a4d" : "#1a4d8f";
  }, 200);
</script>
</body>
</html>
