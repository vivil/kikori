<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問題のないページ</title>
<style>
  body { margin: 0; font-family: sans-serif; line-height: 1.7; }
  main { max-width: 40rem; margin: 0 auto; padding: 1rem; }
  img { max-width: 100%; height: auto; }
  .card { border: 1px solid #555; padding: 1rem; min-height: 3rem; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>問題のないページ</h1>
  <p>このページは幅を狭めても折り返し、文字の間隔を広げても内容が欠けません。</p>
  <div class="card"><p>高さを固定していないカードです。</p></div>
  <p><a id="first" href="#a">最初のリンク</a></p>
  <p><label>お名前 <input id="name" type="text" autocomplete="name"></label></p>
  <p><button id="send" type="button">送信する</button></p>
</main>
</body>
</html>
