# Keeps the pinned commit hashes of the GitHub Actions up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait three days after a release before proposing it, so that a compromised
    # release has time to be noticed and withdrawn. Security updates are not delayed.
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
