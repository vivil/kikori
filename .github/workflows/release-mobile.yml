name: Release (mobile)

# Publishes kikori-mobile to npm when a GitHub release whose tag starts with "mobile-v" is published.
# Authentication uses npm trusted publishing (OIDC), so no npm token is stored in this repository.
# Set this workflow up as a trusted publisher for kikori-mobile on npmjs.com before the first run.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ startsWith(github.event.release.tag_name, 'mobile-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No registry-url here: setup-node would then set NODE_AUTH_TOKEN, which takes precedence over OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./packages/mobile/package.json').version")"
          if [ "$TAG" != "mobile-v$version" ]; then
            echo "::error::Release tag $TAG does not match packages/mobile/package.json version mobile-v$version"
            exit 1
          fi
      - run: npm ci
      - run: npm test --workspace kikori-mobile
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm publish --workspace kikori-mobile --access public
