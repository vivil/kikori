name: Release

# Publishes to npm when a GitHub release is published.
# Authentication uses npm trusted publishing (OIDC), so no npm token is stored in this repository.
# Set this workflow up as a trusted publisher for the package on npmjs.com before the first run.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # No registry-url here: setup-node would then set NODE_AUTH_TOKEN, which takes precedence over OIDC.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version v$version"
            exit 1
          fi
      - run: npm ci
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm test
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm publish --access public
